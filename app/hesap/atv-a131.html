    { k: 'qL', l: 'Lamba başına kapasite (tasarım dozu, UVT)', u: 'm³/h', d: 25 },
    { k: 'banks', l: 'Seri lamba sırası (bank)', u: 'adet', d: 2 },
    { k: 'h', l: 'Kanal su derinliği', u: 'm', d: 1.0 },
    { k: 'sp', l: 'Lamba aks aralığı', u: 'm', d: 0.076 },
    { k: 'mMax', l: 'Kanal başına maks. modül', u: 'adet', d: 16 },
    { k: 'N', l: 'Kanal sayısı', u: 'adet', auto: true },
    { k: 'Lb', l: 'Bank uzunluğu', u: 'm', d: 2.0 },
    { k: 'Lio', l: 'Giriş + çıkış düzlükleri', u: 'm', d: 6.0 },
  ] },
};
const ORDER = ['cs', 'ps', 'fs', 'gr', 'pc', 'cp', 'an', 'bio', 'sc', 'pt', 'et', 'dw', 'uv'];

const INPUTS = [
  { g: 'Genel' },
  { k: 'PE', l: 'Nüfus eşdeğeri', u: 'EN' },
  { k: 'Tmin', l: 'Tasarım sıcaklığı (min, hacim)', u: '°C' },
  { k: 'Tmax', l: 'Tasarım sıcaklığı (maks, oksijen)', u: '°C' },
  { k: 'alt', l: 'Tesis kotu', u: 'm' },
  { g: 'Debiler' },
  { k: 'Qd', l: 'Günlük ortalama kuru hava debisi Q_DW,d', u: 'm³/gün' },
  { k: 'Qdw', l: 'Kuru hava saatlik maks. debi Q_DW,h,maks', u: 'm³/h' },
  { k: 'Qww', l: 'Yağışlı hava maks. debi Q_M', u: 'm³/h' },
  { k: 'Qmin', l: 'Minimum debi', u: 'm³/h' },
  { g: 'Ham atıksu kirlilik yükleri' },
  { k: 'COD', l: 'KOİ', u: 'kg/gün' },
  { k: 'BOD', l: 'BOİ₅', u: 'kg/gün' },
  { k: 'TSS', l: 'AKM', u: 'kg/gün' },
  { k: 'TKN', l: 'TKN', u: 'kg/gün' },
  { k: 'TP', l: 'Toplam P', u: 'kg/gün' },
  { g: 'Geri dönen sular (rejekt)' },

  { k: 'rBOD', l: 'BOİ₅', u: 'kg/gün' },
  { k: 'rTSS', l: 'AKM', u: 'kg/gün' },
  { k: 'rTKN', l: 'TKN', u: 'kg/gün' },
  { k: 'rTP', l: 'Toplam P', u: 'kg/gün' },
  { g: 'Deşarj limitleri' },
  { k: 'lBOD', l: 'BOİ₅', u: 'mg/L' },
  { k: 'lCOD', l: 'KOİ', u: 'mg/L' },

// Örnek veri: West Benghazi AAT proses raporu (2025 ve 2035 kademeleri)
function sampleScenario(stage) {
  const k = stage === 2 ? 240000 / 55300 : 1;
  const r = (x) => Math.round(x * k);
  return {
    name: stage === 2 ? '2. Kademe (2035)' : '1. Kademe (2025)',
    inp: {
      PE: stage === 2 ? 880000 : 202767, Tmin: 15, Tmax: 25, alt: 25,
      Qd: stage === 2 ? 240000 : 55300, Qdw: stage === 2 ? 10000 : 2304, Qww: stage === 2 ? 20000 : 4608, Qmin: stage === 2 ? 5000 : 1150,
      COD: stage === 2 ? 120000 : 27650, BOD: stage === 2 ? 52800 : 12166, TSS: stage === 2 ? 52800 : 12166, TKN: stage === 2 ? 9600 : 2212, TP: stage === 2 ? 1920 : 442,
      rQ: stage === 2 ? 5284 : 1201, rCOD: stage === 2 ? 4687 : 1064, rBOD: stage === 2 ? 1525 : 346, rTSS: stage === 2 ? 3818 : 866, rTKN: stage === 2 ? 255 : 58, rTP: stage === 2 ? 185 : 42,
      lBOD: 25, lCOD: 125, lTSS: 35, lTN: 10, lTP: 1,
    },
    p: {},
  };
}

function par(sc, u) {
  const o = {}; const raw = (sc.p && sc.p[u]) || {};
  for (const f of UNITS[u].f) {
    if (!f.k) continue;
    const v = raw[f.k];
    if (v === '' || v === undefined || v === null) o[f.k] = f.auto ? null : f.d;
    else o[f.k] = f.opts ? v : parseFloat(String(v).replace(',', '.'));
    if (!f.opts && o[f.k] !== null && !isFinite(o[f.k])) o[f.k] = f.auto ? null : f.d;
  }
  return o;
}
function inpNums(inp) {
  const o = {};
  for (const f of INPUTS) if (f.k) { const v = parseFloat(String(inp[f.k] ?? '').replace(',', '.')); o[f.k] = isFinite(v) ? v : 0; }
  return o;
}

// ---------- Satır yardımcıları ----------
const SEC = (t) => ({ s: t });
const ROW = (l, v, u, d = 2, c) => ({ l, v, u, d, c });
const CK = (ok, t) => ({ ok: !!ok, t });

// Oksijen doygunluğu (APHA), mg/L
const Cs = (T) => 14.652 - 0.41022 * T + 0.007991 * T * T - 0.000077774 * T * T * T;

// ============================================================
function compute(S, sc, sysKey) {
  sysKey = sysKey || S.system;
  const sys = SYS[sysKey];
  const I = inpNums(sc.inp);
  const U = Object.assign({}, S.units);
  const forced = [];
  if (sys.an && !U.an) { U.an = true; forced.push('an'); }
  const P = {}; for (const u of ORDER) P[u] = par(sc, u);
  const R = {}; const GW = [];

  const PE = I.PE, Qd = I.Qd, Qh = Qd / 24;
  const Qdw = I.Qdw || Qh, Qww = I.Qww || 2 * Qdw, Qmin = I.Qmin || 0.4 * Qh;
  const Tn = I.Tmin, Tx = Math.max(I.Tmax, I.Tmin);
  const QdT = Qd + I.rQ;
  const L0 = { COD: I.COD, BOD: I.BOD, TSS: I.TSS, TKN: I.TKN, TP: I.TP };
  const Lin = { COD: I.COD + I.rCOD, BOD: I.BOD + I.rBOD, TSS: I.TSS + I.rTSS, TKN: I.TKN + I.rTKN, TP: I.TP + I.rTP };
  const lim = { BOD: I.lBOD, COD: I.lCOD, TSS: I.lTSS, TN: I.lTN, TP: I.lTP };
  const ctx = { PE, Qd, Qh, Qdw, Qww, Qmin, Tn, Tx, QdT, L0, Lin, lim, alt: I.alt };
  if (!(Qd > 0) || !(Lin.COD > 0)) GW.push('Debi ve kirlilik yüklerini “Tasarım Verileri” sayfasına girin.');
  if (sys.stab && U.pc) GW.push('Aerobik stabilizasyon sisteminde ön çöktürme genellikle yapılmaz.');

  // ---------------- IZGARALAR ----------------
  function screen(p, coarse) {
    const out = { rows: [], warn: [], auto: {} };
    const Qs = Qww / 3600;
    const N = p.N ?? Math.max(1, Math.ceil(Qs / 1.5 - 1e-9)); out.auto.N = N;
    const Qc = Qs / N, QcD = Qdw / 3600 / N;
    const e = p.e / 1000, s = p.s / 1000, ratio = e / (e + s), th = p.th * Math.PI / 180;
    const bReq = Qc / (p.h * p.vmax * ratio * (1 - p.fb));
    const b = p.b ?? Math.max(0.5, ceilTo(bReq, 0.1)); out.auto.b = Math.max(0.5, ceilTo(bReq, 0.1));
    const va = Qc / (b * p.h), vb = va / ratio, vbc = vb / (1 - p.fb);
    const vaD = QcD / (b * p.h);
    const hL = p.beta * Math.pow(s / e, 4 / 3) * va * va / (2 * G9) * Math.sin(th);
    const hLc = Math.max(0, (vbc * vbc - va * va) / (2 * G9) / 0.7);
    const nSlot = Math.floor((b + s) / (e + s) + 1e-9), nBar = nSlot - 1;
    const H = p.h + hLc + p.fr;
    const scr = PE * p.rate / 365 / 1000, scrKg = scr * p.rho, scrP = scr * (1 - p.red / 100);
    out.rows.push(SEC('Debi'),
      ROW('Tasarım debisi Q_M', Qww, 'm³/h', 0), ROW('Çalışan / yedek kanal', N + ' + ' + p.Nsb, 'adet'),
      ROW('Kanal başına debi', Qc, 'm³/s', 3),
      SEC('Kanal boyutları'),
      ROW('Gerekli kanal genişliği', bReq, 'm', 2), ROW('Seçilen kanal genişliği b', b, 'm', 2, CK(b >= bReq - 1e-6, '≥ gerekli')),
      ROW('Su derinliği h', p.h, 'm', 2), ROW('Kanal yüksekliği H = h + Δh + hava payı', H, 'm', 2), ROW('Kanal uzunluğu', p.L, 'm', 1),
      ROW('Aralık sayısı / çubuk sayısı', nSlot + ' / ' + nBar, 'adet'), ROW('Net açıklık', nSlot * e, 'm', 2),
      SEC('Hız kontrolleri'),
      ROW('Yaklaşım hızı (Q_M)', va, 'm/s', 2, CK(va >= 0.4 && va <= 1.0, '0,4 – 1,0')),
      ROW('Yaklaşım hızı (Q_DW,h,maks)', vaD, 'm/s', 2, CK(vaD >= 0.3, '≥ 0,3 (çökelme)')),
      ROW('Çubuk arası hız, temiz', vb, 'm/s', 2, CK(vb <= p.vmax, '≤ ' + p.vmax)),
      ROW('Çubuk arası hız, tıkalı', vbc, 'm/s', 2, CK(vbc <= p.vmax * 1.001, '≤ ' + p.vmax)),
      SEC('Yük kaybı'),
      ROW('Temiz ızgara (Kirschmer) h = β(s/e)^4/3 · v²/2g · sinθ', hL, 'm', 3),
      ROW('Tıkalı ızgara h = (v_b² − v_a²)/(2g·0,7)', hLc, 'm', 3),
      SEC('Izgara atığı'),
      ROW('Atık hacmi', scr, 'm³/gün', 2), ROW('Atık ağırlığı', scrKg, 'kg/gün', 0), ROW('Pres sonrası hacim', scrP, 'm³/gün', 2),
      ROW('Konveyör kapasitesi (pik faktörü 6)', scr * 6 / 24, 'm³/h', 2));
    out.dim = { N, Nsb: p.Nsb, b, h: p.h, H, L: p.L, th: p.th, e: p.e };
    out.key = [['Kanal', `${N}+${p.Nsb} adet`], ['b × H × L', `${f2(b)} × ${f2(H)} × ${f1(p.L)} m`], ['Aralık', p.e + ' mm']];
    return out;
  }
  if (U.cs) R.cs = screen(P.cs, true);
  if (U.fs) R.fs = screen(P.fs, false);

  // ---------------- POMPA İSTASYONU ----------------
  if (U.ps) {
    const p = P.ps, o = { rows: [], warn: [], auto: {} };
    const N = p.N ?? Math.max(1, Math.ceil(Qww / p.Qp - 1e-9)); o.auto.N = N;
    const Nsb = p.Nsb ?? Math.max(1, Math.ceil(N / 4 - 1e-9)); o.auto.Nsb = Nsb;
    const q = Qww / N, ql = q / 3.6;
    const V = 0.9 * ql / p.Z; // m³ (A134: Q in L/s)
    const nc = Math.max(1, Math.round(p.nc));
    const pumpsPerC = Math.ceil((N + Nsb) / nc);
    const A = V / p.hu;
    const Lp = pumpsPerC * p.sp;
    let W, L;
    if (p.W) { W = p.W; L = Math.max(ceilTo(A / W, 0.1), Lp); }
    else { L = Math.max(ceilTo(Math.sqrt(A * p.lw), 0.1), Lp); W = Math.max(2.0, ceilTo(A / L, 0.1)); }
    o.auto.W = p.W ? null : W;
    const Vact = L * W * p.hu, Htot = p.hd + p.hu + p.hf;
    const Pk = 1000 * G9 * (q / 3600) * p.Hm / p.eta / 1000;
    o.rows.push(SEC('Pompalar'),
      ROW('Tasarım debisi Q_M', Qww, 'm³/h', 0), ROW('Asil + yedek pompa', N + ' + ' + Nsb, 'adet'),
      ROW('Pompa başına debi', q, 'm³/h', 0), ROW('', ql, 'L/s', 1),
      ROW('Pompa gücü (mil) P = ρgQH/η', Pk, 'kW', 1),
      SEC('Islak hazne (A134: V = 0,9·Q_P/Z)'),
      ROW('Saatlik kalkış sayısı Z', p.Z, '1/h', 0, CK(p.Z <= 15, '≤ 15')),
      ROW('Gerekli faydalı hacim (bölme başına)', V, 'm³', 1), ROW('Bölme sayısı', nc, 'adet'),
      ROW('Faydalı su yüksekliği', p.hu, 'm', 2), ROW('Gerekli alan', A, 'm²', 1),
      ROW('Hazne genişliği W', W, 'm', 2), ROW('Hazne uzunluğu L', L, 'm', 2),
      ROW('Mevcut faydalı hacim', Vact, 'm³', 1, CK(Vact >= V - 1e-6, '≥ ' + f1(V))),
      ROW('Toplam derinlik (ölü + faydalı + hava payı)', Htot, 'm', 2),
      ROW('Toplam hacim (tüm bölmeler)', nc * L * W * (p.hd + p.hu), 'm³', 0));
    o.dim = { L, W, hd: p.hd, hu: p.hu, hf: p.hf, n: pumpsPerC, nd: N, nc };
    o.key = [['Pompa', `${N}+${Nsb} × ${f0(q)} m³/h`], ['Hazne', `${nc} × ${f2(L)} × ${f2(W)} m`], ['Derinlik', f2(Htot) + ' m']];
    R.ps = o;
  }

  // ---------------- KUM-YAĞ TUTUCU ----------------
  if (U.gr) {
    const p = P.gr, o = { rows: [], warn: [], auto: {} };
    const N = p.N ?? Math.max(1, Math.ceil(Qww / p.Qmax - 1e-9)); o.auto.N = N;
    const Ql = Qww / N, QlD = Qdw / N;
    const b = p.b ?? ceilTo(p.bh * p.h, 0.1); o.auto.b = ceilTo(p.bh * p.h, 0.1);
    const bF = ceilTo(p.fF * b, 0.05);
    const A = b * p.h - 0.5 * b * 0.25 * b;
    const Lreq = Math.max(QlD * p.tD / 60, Ql * p.tW / 60) / A;
    const L = p.L ?? Math.max(ceilTo(Lreq, 0.5), ceilTo(5 * b, 0.5)); o.auto.L = Math.max(ceilTo(Lreq, 0.5), ceilTo(5 * b, 0.5));
    const V = A * L, tD = V / QlD * 60, tW = V / Ql * 60, vh = Ql / 3600 / A;
    const qF = QlD / (bF * L);
    const air = p.air * V * N;
    const grit = PE * p.grit / 365 / 1000, grease = PE / 1000 * p.grease;
    const Wline = b + p.tw + bF;
    o.rows.push(SEC('Debi'),
      ROW('Hat sayısı', N, 'adet'), ROW('Hat başına Q_M', Ql, 'm³/h', 0), ROW('Hat başına Q_DW,h,maks', QlD, 'm³/h', 0),
      SEC('Kesit'),
      ROW('Su derinliği h', p.h, 'm', 2), ROW('Kum bölmesi genişliği b_SF', b, 'm', 2),
      ROW('b_SF / h', b / p.h, '-', 2, CK(b / p.h >= 0.8 && b / p.h <= 1.2, '0,8 – 1,2')),
      ROW('Yağ bölmesi genişliği b_FF', bF, 'm', 2, CK(bF / b >= 0.2 && bF / b <= 1.0, '0,2–1,0 b_SF')),
      ROW('Islak kesit alanı (eğimli taban düşülmüş)', A, 'm²', 2, CK(A >= 1 && A <= 15, '1 – 15')),
      ROW('Hat toplam genişliği', Wline, 'm', 2),
      SEC('Uzunluk ve kontroller'),
      ROW('Gerekli uzunluk', Lreq, 'm', 1), ROW('Seçilen uzunluk L', L, 'm', 1, CK(L <= 50, '≤ 50')),
      ROW('L / b_SF', L / b, '-', 1, CK(L / b >= 5 && L / b <= 15, '≈ 10')),
      ROW('Hacim (hat başına)', V, 'm³', 0),
      ROW('Bekleme süresi, kuru hava', tD, 'dk', 1, CK(tD >= p.tD - 1e-6, '≥ ' + p.tD)),
      ROW('Bekleme süresi, Q_M', tW, 'dk', 1, CK(tW >= p.tW - 1e-6, '≥ ' + p.tW)),
      ROW('Yatay hız (Q_M)', vh, 'm/s', 3, CK(vh <= 0.2, '≤ 0,20')),
      ROW('Yağ bölmesi yüzey yükü (kuru)', qF, 'm/h', 1, CK(qF <= 25, '≤ 25')),
      SEC('Hava ve ürünler'),
      ROW('Toplam hava ihtiyacı', air, 'Nm³/h', 0), ROW('Kum miktarı', grit, 'm³/gün', 2), ROW('Yağ miktarı', grease, 'L/gün', 0));
    o.dim = { N, b, bF, h: p.h, tw: p.tw, L };
    o.key = [['Hat', N + ' adet'], ['L × (b_SF + b_FF)', `${f1(L)} × (${f2(b)} + ${f2(bF)}) m`], ['h', f2(p.h) + ' m']];
    R.gr = o;
  }

  // ---------------- ÖN ÇÖKTÜRME ----------------
  let bioIn = { COD: Lin.COD, BOD: Lin.BOD, TSS: Lin.TSS, TKN: Lin.TKN, TP: Lin.TP }, PSkg = 0;
  if (U.pc) {
    const p = P.pc, o = { rows: [], warn: [], auto: {} };
    const circ = p.type !== 'rect';
    const Areq = Math.max(Qdw * p.tR / p.h, Qww / p.qA);
    const Amax = circ ? Math.PI / 4 * p.Dmax * p.Dmax : p.Dmax * p.Dmax * p.lw;
    const N = p.N ?? Math.max(1, Math.ceil(Areq / Amax - 1e-9)); o.auto.N = N;
    const At = Areq / N;
    let D = 0, Din = 0, W = 0, L = 0, Anet, V, wlen;
    if (circ) {
      const D0 = Math.sqrt(4 * At / Math.PI);
      Din = p.Din ?? Math.max(2, roundTo(0.14 * D0, 0.5)); o.auto.Din = Math.max(2, roundTo(0.14 * D0, 0.5));
      const Da = ceilTo(Math.sqrt(4 * At / Math.PI + Din * Din), 0.5); o.auto.D = Da;
      D = p.D ?? Da;
      Anet = Math.PI / 4 * (D * D - Din * Din);
      V = Anet * p.h + Math.PI * (D / 2) ** 2 * p.slope * D / 2 / 3;
      wlen = Math.PI * (D - 0.6);
    } else {
      const Wa = ceilTo(Math.sqrt(At / p.lw), 0.5); o.auto.W = Wa;
      W = p.W ?? Wa; L = ceilTo(At / W, 0.5);
      Anet = W * L; V = Anet * p.h; wlen = 2 * W;
    }
    const tR = V * N / Qdw, tRw = V * N / Qww, qA = Qww / (N * Anet), qAd = Qdw / (N * Anet), wl = Qww / N / wlen;
    const ts = [0, 0.5, 1.0, 1.5, 2.0];
    const rCODa = interp(tR, ts, [0, 30, 30, 35, 35]), rSSa = interp(tR, ts, [0, 50, 50, 60, 60]), rNa = interp(tR, ts, [0, 10, 10, 10, 10]), rPa = rNa;
    o.auto.rCOD = rCODa; o.auto.rSS = rSSa; o.auto.rN = rNa; o.auto.rP = rPa;
    const rC = (p.rCOD ?? rCODa) / 100, rS = (p.rSS ?? rSSa) / 100, rN = (p.rN ?? rNa) / 100, rP = (p.rP ?? rPa) / 100;
    bioIn = { COD: Lin.COD * (1 - rC), BOD: Lin.BOD * (1 - rC), TSS: Lin.TSS * (1 - rS), TKN: Lin.TKN * (1 - rN), TP: Lin.TP * (1 - rP) };
    PSkg = Lin.TSS * rS;
    const PSm3 = PSkg / (p.ds * 10);
    o.rows.push(SEC('Boyutlandırma'),
      ROW('Havuz tipi', circ ? 'Dairesel' : 'Dikdörtgen', ''), ROW('Havuz sayısı', N, 'adet'),
      ROW('Gerekli toplam alan', Areq, 'm²', 0),
      ...(circ ? [ROW('Çap D', D, 'm', 1), ROW('Giriş yapısı çapı', Din, 'm', 1)] : [ROW('Genişlik W', W, 'm', 1), ROW('Uzunluk L', L, 'm', 1)]),
      ROW('Net yüzey alanı (havuz başına)', Anet, 'm²', 0), ROW('Yan su derinliği', p.h, 'm', 2),
      ROW('Hacim (havuz başına)', V, 'm³', 0), ROW('Toplam hacim', V * N, 'm³', 0),
      SEC('Kontroller'),
      ROW('Bekleme süresi (Q_DW,h,maks)', tR, 'h', 2, CK(tR >= 0.5, '≥ 0,5')),
      ROW('Bekleme süresi (Q_M)', tRw, 'h', 2, CK(tRw >= 0.5, '≥ 0,5')),
      ROW('Yüzey yükü (Q_M)', qA, 'm/h', 2, CK(qA <= p.qA + 1e-6, '≤ ' + p.qA)),
      ROW('Yüzey yükü (Q_DW,h,maks)', qAd, 'm/h', 2),
      ROW('Savak yükü (Q_M)', wl, 'm³/(m·h)', 1, CK(wl <= p.wl, '≤ ' + p.wl)),
      SEC('Giderim (A131 Tablo 2, t = ' + f2(tR) + ' h)'),
      ROW('KOİ / BOİ₅', rC * 100, '%', 0), ROW('AKM', rS * 100, '%', 0), ROW('TKN', rN * 100, '%', 0), ROW('TP', rP * 100, '%', 0),
      SEC('Çıkış (biyolojik girişi)'),
      ...['COD', 'BOD', 'TSS', 'TKN', 'TP'].map(k => ROW(LBL[k], bioIn[k], 'kg/gün · ' + f1(bioIn[k] * 1000 / QdT) + ' mg/L', 0)),
      SEC('Ön çöktürme çamuru'),
      ROW('Kuru madde', PSkg, 'kg KM/gün', 0), ROW('Katı madde', p.ds, '%', 1), ROW('Çamur hacmi', PSm3, 'm³/gün', 0),
      ROW('Pompa kapasitesi (pik 1,5; ' + p.opH + ' h/gün)', PSm3 * 1.5 / p.opH, 'm³/h', 1));
    o.dim = { circ, D, Din, W, L, h: p.h, slope: p.slope, N };
    o.key = circ ? [['Havuz', N + ' adet dairesel'], ['Ø × h', `${f1(D)} × ${f2(p.h)} m`], ['t_R', f2(tR) + ' h']]
      : [['Havuz', N + ' adet dikdörtgen'], ['L × W × h', `${f1(L)} × ${f1(W)} × ${f2(p.h)} m`], ['t_R', f2(tR) + ' h']];
    o.PSm3 = PSm3; o.ds = p.ds;
    R.pc = o;
  }

    o.rows.push(SEC('Boyutlandırma'),
      ROW('Q_DW,h,maks', Qdw, 'm³/h', 0), ROW(sys.anIn === 'R' ? 'r-devri (anoksik karışım)' : 'Geri devir çamuru', Qin, 'm³/h', 0),
      ROW('Temas süresi t_AN', p.tAN, 'h', 2, CK(p.tAN >= 0.5, '≥ 0,5')),
      ROW('Gerekli toplam hacim', V, 'm³', 0), ROW('Tank sayısı', N, 'adet'),
      ROW('Su derinliği', h, 'm', 2), ROW('Genişlik', W, 'm', 1), ROW('Uzunluk', L, 'm', 1),
      ROW('Tank başına hacim', Va, 'm³', 0), ROW('Gerçek temas süresi', tAct, 'h', 2),
      ROW('Seri bölme sayısı', p.nc, 'adet'), ROW('Karıştırıcı gücü (tank başına)', Va * p.mix / 1000, 'kW', 1),
      ROW('Karıştırıcı (bölme başına)', Va * p.mix / 1000 / p.nc, 'kW', 2),
      SEC('Bio-P'), ROW('Biyolojik P giderimi X_P,BioP', XPBioP, 'mg/L', 2), ROW('Bio-P çamuru (3·X_P,BioP)', QdT * 3 * XPBioP / 1000, 'kg KM/gün', 0));
    o.dim = { L, W, h, fb: p.fb, N, zones: Array.from({ length: Math.max(1, Math.round(p.nc)) }, (_, i) => ({ t: 'AN', n: 'AN-' + (i + 1), V: Va / p.nc, f: 1 / p.nc })) };
    o.key = [['Tank', N + ' adet'], ['L × W × h', `${f1(L)} × ${f1(W)} × ${f2(h)} m`], ['V', f0(Va * N) + ' m³']];
    R.an = o; BIO.Van = Va * N;
  }

  // ---------------- KİMYASAL P ----------------
  if (U.cp) {
    const p = P.cp, o = { rows: [], warn: [], auto: {} };
    const Al = chem === 'Al', MW = Al ? 26.98 : 55.85;
    const XP = XPprecReq;
    const Pkg = XP * QdT / 1000;
    const Me = p.beta * MW / 30.97 * Pkg;
    const prod = Me / (p.metal / 100), prodL = prod / p.rho;
    const Vst = prodL * p.days / 1000;
    const Dt = ceilTo(Math.sqrt(4 * Vst / p.N / Math.PI / p.h), 0.1); o.auto.D = Dt;
    const D = p.D ?? Dt;
    const Vact = Math.PI / 4 * D * D * p.h * p.N;
    o.rows.push(SEC('Çöktürme ihtiyacı'),
      ROW('Kimyasal çöktürülecek P', XP, 'mg/L', 2), ROW('', Pkg, 'kg P/gün', 1),
      ROW('Metal ihtiyacı (β·M_Me/M_P)', Me, 'kg ' + (Al ? 'Al' : 'Fe') + '/gün', 1),
      ROW('Metal dozu', Me * 1000 / QdT, 'mg/L', 2),
      ROW('Ticari ürün', prod, 'kg/gün', 0), ROW('', prodL, 'L/gün', 0), ROW('Dozaj debisi', prodL / 24, 'L/h', 1),
      ROW('Kimyasal çamur (' + (Al ? '5,3' : '6,8') + '·X_P,Prec)', QdT * (Al ? 5.3 : 6.8) * XP / 1000, 'kg KM/gün', 0),
      SEC('Depolama'),
      ROW('Gerekli depo hacmi (' + p.days + ' gün)', Vst, 'm³', 1), ROW('Depo sayısı', p.N, 'adet'),
      ROW('Sıvı yüksekliği', p.h, 'm', 2), ROW('Depo çapı', D, 'm', 2), ROW('Mevcut toplam hacim', Vact, 'm³', 1, CK(Vact >= Vst - 0.01, '≥ ' + f1(Vst))),
      SEC('Dozaj pompaları'), ROW('Asil + yedek', p.Np + ' + 1', 'adet'), ROW('Pompa kapasitesi (×1,5 pik)', prodL / 24 / p.Np * 1.5, 'L/h', 1));
    if (XP <= 0) o.warn.push('Biyolojik giderim hedef P değerini karşılıyor; kimyasal dozaj yalnız yedek amaçlı.');
    o.dim = { D, H: p.h + 0.5, h: p.h, N: p.N };
    o.key = [['Ürün', f0(prodL) + ' L/gün'], ['Depo', `${p.N} × Ø${f2(D)} m`], ['Dozaj', f1(prodL / 24) + ' L/h']];
    R.cp = o;
  }

  // ---------------- SON ÇÖKTÜRME ----------------
  let WASm3 = SPd / SSRS;
  if (U.sc) {
    const p = s, o = { rows: [], warn: [], auto: { SSAT: SSATc } };
    if (p.SSAT && p.SSAT > SSATc + 1e-6) o.warn.push('Seçilen MLSS, son çöktürmeden geri döndürülebilecek değerden büyük.');
    const DSV = SSAT * p.ISV;
    const qA = Math.min(p.qSV / DSV, p.qAmax);
    const Areq = Qww / qA;
    const Amax = Math.PI / 4 * p.Dmax * p.Dmax;
    const N = p.N ?? Math.max(1, Math.ceil(Areq / (Amax * 0.97) - 1e-9)); o.auto.N = Math.max(1, Math.ceil(Areq / (Amax * 0.97) - 1e-9));
    const D0 = Math.sqrt(4 * Areq / N / Math.PI);
    const Din = p.Din ?? Math.max(3, roundTo(0.13 * D0, 0.5)); o.auto.Din = Math.max(3, roundTo(0.13 * D0, 0.5));
    const Da = ceilTo(Math.sqrt(4 * Areq / N / Math.PI + Din * Din), 0.5); o.auto.D = Da;
    const D = p.D ?? Da;
    const A = Math.PI / 4 * (D * D - Din * Din);
    const qAa = Qww / (N * A), qSVa = qAa * DSV;
    const h1 = p.h1, h2 = 0.5 * qAa * (1 + p.RV) / (1 - DSV / 1000), h3 = 1.5 * 0.3 * qSVa * (1 + p.RV) / 500;
    const h4 = SSAT * qAa * (1 + p.RV) * p.tE / SSBS;
    const hreq = Math.max(3.0, h1 + h2 + h3 + h4);
    const H = p.H ?? ceilTo(hreq, 0.1); o.auto.H = ceilTo(hreq, 0.1);
    const R2 = D / 2, hSide = H - p.slope * R2 / 3, hCen = H + p.slope * 2 * R2 / 3;
    const V = A * H;
    const wlen = Math.PI * (D - 0.8) * p.sides, wl = Qww / N / wlen;
    const QRSmax = p.RV * Qww;
    const nRas = N * p.Nras;
    WASm3 = SPd / SSRS;
    o.rows.push(SEC('Çamur'),
      ROW('ISV', p.ISV, 'mL/g', 0, CK(p.ISV >= 50 && p.ISV <= 180, '50 – 180')), ROW('t_E', p.tE, 'h', 1, CK(p.tE >= 1.5 && p.tE <= 2.5, '1,5 – 2,5')),
      ROW('SS_BS = 1000/ISV · t_E^(1/3)', SSBS, 'kg/m³', 2), ROW('SS_RS = ' + p.kRS + ' · SS_BS', SSRS, 'kg/m³', 2),
      ROW('SS_AT = RV·SS_RS/(1+RV)', SSATc, 'kg/m³', 2), ROW('Seçilen SS_AT', SSAT, 'kg/m³', 2),
      ROW('DSV = SS_AT · ISV', DSV, 'L/m³', 0, CK(DSV <= p.DSVmax, '≤ ' + p.DSVmax)),
      SEC('Yüzey'),
      ROW('q_A = q_SV / DSV (≤ ' + p.qAmax + ')', qA, 'm/h', 2), ROW('Gerekli net alan', Areq, 'm²', 0),
      ROW('Havuz sayısı', N, 'adet'), ROW('Giriş yapısı çapı', Din, 'm', 1), ROW('Çap D', D, 'm', 1, CK(D <= p.Dmax, '≤ ' + p.Dmax)),
      ROW('Net alan (havuz başına)', A, 'm²', 0),
      ROW('Gerçek q_A (Q_M)', qAa, 'm/h', 2, CK(qAa <= qA + 1e-6, '≤ ' + f2(qA))),
      ROW('Gerçek q_SV', qSVa, 'L/(m²·h)', 0, CK(qSVa <= p.qSV + 1e-6, '≤ ' + p.qSV)),
      ROW('Katı madde yükü (Q_M)', qAa * (1 + p.RV) * SSAT, 'kg/(m²·h)', 2),
      SEC('Derinlik (2/3 yarıçapta)'),
      ROW('h₁ berrak su', h1, 'm', 2), ROW('h₂ ayırma / geri akış', h2, 'm', 2), ROW('h₃ yoğunluk akımı / depolama', h3, 'm', 2),
      ROW('h₄ yoğunlaşma ve çamur çekme', h4, 'm', 2), ROW('Gerekli h_top (≥ 3,0)', hreq, 'm', 2),
      ROW('Seçilen h_top', H, 'm', 2, CK(H >= hreq - 1e-6, '≥ ' + f2(hreq))),
      ROW('Kenar su derinliği', hSide, 'm', 2), ROW('Merkez su derinliği', hCen, 'm', 2),
      ROW('Hacim (havuz başına)', V, 'm³', 0), ROW('Bekleme süresi (Q_M)', V * N / Qww, 'h', 2), ROW('Bekleme süresi (Q_DW,d)', V * N / Qh, 'h', 1),
      ROW('Savak yükü (Q_M)', wl, 'm³/(m·h)', 1, CK(wl <= p.wl, '≤ ' + p.wl)),
      SEC('Geri devir (RAS) ve fazla çamur (WAS)'),
      ROW('RAS debisi (RV·Q_M)', QRSmax, 'm³/h', 0), ROW('RAS pompası (asil ' + nRas + ' + yedek ' + Math.max(1, Math.ceil(nRas / 4)) + ')', QRSmax / nRas, 'm³/h', 0),
      ROW('Fazla çamur', SPd, 'kg KM/gün', 0), ROW('', WASm3, 'm³/gün', 0), ROW('WAS pompası (1 asil + 1 yedek, ' + p.wasH + ' h/gün)', WASm3 / p.wasH * 1.2, 'm³/h', 1));
    o.dim = { circ: true, D, Din, h: hSide, H, slope: p.slope, N, bands: [h1, h2, h3, h4] };
    o.key = [['Havuz', N + ' adet dairesel'], ['Ø × h_top', `${f1(D)} × ${f2(H)} m`], ['q_A', f2(qAa) + ' m/h']];
    R.sc = o;
  }

  // ---------------- ÇAMUR HATTI ----------------
  let thPS = null; // yoğunlaştırılmış ön çöktürme çamuru
  if (U.pt) {
    const p = P.pt, o = { rows: [], warn: [], auto: {} };
    if (!U.pc || !PSkg) { o.warn.push('Ön çöktürme seçili olmadığından ön çöktürme çamuru yok.'); }
    const kg = PSkg, inDS = U.pc ? P.pc.ds : 3, m3 = kg / (inDS * 10);
    const A = kg / p.SLR;
    const Amax = Math.PI / 4 * p.Dmax * p.Dmax;
    const N = p.N ?? Math.max(1, Math.ceil(A / Amax - 1e-9)); o.auto.N = Math.max(1, Math.ceil(A / Amax - 1e-9));
    const Da = Math.max(4, ceilTo(Math.sqrt(4 * A / N / Math.PI), 0.5)); o.auto.D = Da;
    const D = p.D ?? Da;
    const Aa = Math.PI / 4 * D * D;
    const outKg = kg * p.cap / 100, outM3 = outKg / (p.dsOut * 10);
    const V = Aa * p.h + Aa * p.slope * D / 2 / 3;
    o.rows.push(SEC('Giriş'), ROW('Ön çöktürme çamuru', kg, 'kg KM/gün', 0), ROW('', m3, 'm³/gün', 0), ROW('Giriş KM', inDS, '%', 1),
      SEC('Boyutlandırma'), ROW('Katı yüzey yükü', p.SLR, 'kg/(m²·gün)', 0), ROW('Gerekli alan', A, 'm²', 0),
      ROW('Yoğunlaştırıcı sayısı', N, 'adet'), ROW('Çap', D, 'm', 1), ROW('Gerçek katı yükü', kg / (N * Aa), 'kg/(m²·gün)', 0, CK(kg / (N * Aa) <= 150, '≤ 150')),
      ROW('Hidrolik yük', m3 / (N * Aa), 'm³/(m²·gün)', 1, CK(m3 / (N * Aa) <= 32, '≤ 32')),
      ROW('Yan su derinliği', p.h, 'm', 2), ROW('Hacim (adet)', V, 'm³', 0),
      SEC('Çıkış'), ROW('Yoğunlaşmış çamur', outKg, 'kg KM/gün', 0), ROW('', outM3, 'm³/gün', 1), ROW('Çıkış KM', p.dsOut, '%', 1),
      ROW('Üst su (geri döner)', m3 - outM3, 'm³/gün', 0), ROW('Üst suda AKM', kg - outKg, 'kg/gün', 0));
    o.dim = { circ: true, D, Din: Math.max(1, D * 0.12), h: p.h, H: p.h, slope: p.slope, N, thick: true };
    o.key = [['Adet', N], ['Ø × h', `${f1(D)} × ${f2(p.h)} m`], ['Çıkış', f0(outM3) + ' m³/gün']];
    R.pt = o; thPS = { kg: outKg, m3: outM3 };
  }
  let thES = null;
  if (U.et) {
    const p = P.et, o = { rows: [], warn: [], auto: {} };
    const kg = SPd, m3 = WASm3, ds = SSRS / 10;
    const Qh_ = m3 / 24;
    const Vst = Qh_ * p.tSt;
    const Ast = Vst / p.h;
    const Wa = Math.max(3, ceilTo(Math.sqrt(Ast), 0.5)); o.auto.W = Wa;
    const W = p.W ?? Wa, L = Math.max(W * 0.5, ceilTo(Ast / W, 0.5));
    const feed = m3 * 7 / p.opD / p.opH;
    const N = p.N ?? Math.max(1, Math.ceil(feed / p.capU - 1e-9)); o.auto.N = Math.max(1, Math.ceil(feed / p.capU - 1e-9));
    const outKg = kg * p.cap / 100, outM3 = outKg / (p.dsOut * 10);
    const poly = kg / 1000 * p.poly;
    o.rows.push(SEC('Fazla çamur'), ROW('Kuru madde', kg, 'kg KM/gün', 0), ROW('Hacim', m3, 'm³/gün', 0), ROW('KM', ds, '%', 2),
      SEC('Depolama tankı'), ROW('Depolama süresi', p.tSt, 'h', 1), ROW('Gerekli hacim', Vst, 'm³', 0),
      ROW('Su derinliği', p.h, 'm', 2), ROW('L × W', f1(L) + ' × ' + f1(W), 'm'), ROW('Mevcut hacim', L * W * p.h, 'm³', 0, CK(L * W * p.h >= Vst - 0.5, '≥ ' + f0(Vst))),
      SEC('Mekanik yoğunlaştırıcı'), ROW('Besleme debisi', feed, 'm³/h', 1), ROW('Asil + yedek ünite', N + ' + ' + p.Nsb, 'adet'),
      ROW('Ünite yükü', feed / N, 'm³/h', 1, CK(feed / N <= p.capU + 1e-6, '≤ ' + p.capU)), ROW('Katı yükü (ünite)', kg * 7 / p.opD / p.opH / N, 'kg KM/h', 0),
      ROW('Polimer', poly, 'kg/gün', 1),
      SEC('Çıkış'), ROW('Yoğunlaşmış çamur', outKg, 'kg KM/gün', 0), ROW('', outM3, 'm³/gün', 1), ROW('Süzüntü suyu', m3 - outM3, 'm³/gün', 0));
    o.dim = { L, W, h: p.h, fb: 0.5, N: 1, zones: [{ t: 'ST', n: 'Depolama', f: 1, V: L * W * p.h }], noDiff: true };
    o.key = [['Depo', `${f1(L)} × ${f1(W)} × ${f2(p.h)} m`], ['Yoğunlaştırıcı', `${N}+${p.Nsb} × ${p.capU} m³/h`]];
    R.et = o; thES = { kg: outKg, m3: outM3 };
  }
  if (U.dw) {
    const p = P.dw, o = { rows: [], warn: [], auto: {} };
    const ps = thPS || (U.pc ? { kg: PSkg, m3: R.pc.PSm3 } : { kg: 0, m3: 0 });
    const es = thES || { kg: SPd, m3: WASm3 };
    const kg = ps.kg + es.kg, m3 = ps.m3 + es.m3, ds = kg / m3 / 10;
    const feed = m3 * 7 / p.opD / p.opH;
    const N = p.N ?? Math.max(1, Math.ceil(feed / p.capU - 1e-9)); o.auto.N = Math.max(1, Math.ceil(feed / p.capU - 1e-9));
    const outKg = kg * p.cap / 100, cake = outKg / (p.dsOut * 10);
    const poly = kg / 1000 * p.poly;
    const Vs = cake * p.days * 7 / p.opD;
    const Dsa = ceilTo(Math.sqrt(4 * Vs / p.Ns / Math.PI / p.hs), 0.1); o.auto.Ds = Dsa;
    const Ds = p.Ds ?? Dsa;
    o.rows.push(SEC('Besleme'), ROW('Ön çöktürme çamuru', ps.kg, 'kg KM/gün', 0), ROW('Fazla çamur', es.kg, 'kg KM/gün', 0),
      ROW('Toplam', kg, 'kg KM/gün', 0), ROW('', m3, 'm³/gün', 0), ROW('Karışım KM', ds, '%', 2),
      SEC('Dekantör'), ROW('Çalışma', p.opD + ' gün/hafta · ' + p.opH + ' h/gün', ''), ROW('Besleme debisi', feed, 'm³/h', 1),
      ROW('Asil + yedek', N + ' + ' + p.Nsb, 'adet'), ROW('Ünite yükü', feed / N, 'm³/h', 1, CK(feed / N <= p.capU + 1e-6, '≤ ' + p.capU)),
      ROW('Katı yükü (ünite)', kg * 7 / p.opD / p.opH / N, 'kg KM/h', 0),
      ROW('Polimer', poly, 'kg/gün', 1), ROW('Polimer çözeltisi (%0,2)', poly / 0.002 / 1000, 'm³/gün', 1),
      SEC('Çıkış'), ROW('Kek', outKg, 'kg KM/gün', 0), ROW('Kek hacmi', cake, 'm³/gün', 1), ROW('', cake * 365, 'm³/yıl', 0),
      ROW('Santrat (geri döner)', m3 - cake, 'm³/gün', 0), ROW('Santratta AKM', kg - outKg, 'kg/gün', 0),
      SEC('Kek silosu'), ROW('Gerekli hacim', Vs, 'm³', 0), ROW('Silo sayısı', p.Ns, 'adet'), ROW('Dolu yükseklik', p.hs, 'm', 1), ROW('Çap', Ds, 'm', 1),
      ROW('Mevcut hacim', Math.PI / 4 * Ds * Ds * p.hs * p.Ns, 'm³', 0, CK(Math.PI / 4 * Ds * Ds * p.hs * p.Ns >= Vs - 0.5, '≥ ' + f0(Vs))));
    o.dim = { D: Ds, H: p.hs + 1.0, h: p.hs, N: p.Ns, silo: true };
    o.key = [['Dekantör', `${N}+${p.Nsb} × ${p.capU} m³/h`], ['Kek', f1(cake) + ' m³/gün'], ['Silo', `${p.Ns} × Ø${f1(Ds)} m`]];
    R.dw = o;
  }

  // ---------------- UV ----------------
  if (U.uv) {
    const p = P.uv, o = { rows: [], warn: [], auto: {} };
    const lpm = Math.max(1, Math.floor((p.h - 0.1) / p.sp));
    const lampsBank = Math.ceil(Qww / p.qL);
    const modsTot = Math.ceil(lampsBank / lpm);
    const N = p.N ?? Math.max(1, Math.ceil(modsTot / p.mMax - 1e-9)); o.auto.N = Math.max(1, Math.ceil(modsTot / p.mMax - 1e-9));
    const mods = Math.ceil(modsTot / N);
    const b = ceilTo(mods * p.sp + 0.1, 0.05);
    const v = Qww / 3600 / N / (b * p.h);
    const L = p.banks * p.Lb + p.Lio;
    o.rows.push(SEC('Lamba hesabı'), ROW('Tasarım debisi Q_M', Qww, 'm³/h', 0), ROW('Lamba başına kapasite', p.qL, 'm³/h', 0),
      ROW('Bank başına lamba (tüm kanallar)', lampsBank, 'adet'), ROW('Modül başına lamba (su derinliğinden)', lpm, 'adet'),
      ROW('Seri bank sayısı', p.banks, 'adet'), ROW('Toplam lamba', lampsBank * p.banks, 'adet'),
      SEC('Kanal'), ROW('Kanal sayısı', N, 'adet'), ROW('Kanal başına modül (bank)', mods, 'adet'),
      ROW('Kanal genişliği', b, 'm', 2), ROW('Su derinliği', p.h, 'm', 2), ROW('Kanal uzunluğu', L, 'm', 1),
      ROW('Kanal hızı (Q_M)', v, 'm/s', 2, CK(v >= 0.05 && v <= 0.6, '0,05 – 0,6')));
    o.dim = { N, b, h: p.h, L, banks: p.banks, Lb: p.Lb, mods, lpm, sp: p.sp };
    o.key = [['Kanal', N + ' adet'], ['b × h × L', `${f2(b)} × ${f2(p.h)} × ${f1(L)} m`], ['Lamba', lampsBank * p.banks + ' adet']];
    R.uv = o;
  }

  return { R, U, P, ctx, sys, sysKey, GW, BIO, forced, c };
}

// sayı biçimleri
const fmtN = (v, d = 2) => (v === null || v === undefined || (typeof v === 'number' && !isFinite(v))) ? '—' : (typeof v === 'number' ? v.toLocaleString('tr-TR', { minimumFractionDigits: d, maximumFractionDigits: d }) : String(v));
const f0 = (v) => fmtN(v, 0), f1 = (v) => fmtN(v, 1), f2 = (v) => fmtN(v, 2);
const LBL = { COD: 'KOİ', BOD: 'BOİ₅', TSS: 'AKM', TKN: 'TKN', TP: 'TP' };
/*ENGINE-END*/

// ============================================================
//  Ölçülü çizimler (SVG)
// ============================================================
const DEFS = `<defs><marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.5L10,5L0,8.5z" class="mk"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkf"/></marker><pattern id="hc" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="hcb"/><line x1="0" y1="0" x2="0" y2="6" class="hcl"/></pattern></defs>`;
const svgOpen = (w, h, lab) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" class="dwgsvg" role="img" aria-label="${lab || 'çizim'}">${DEFS}`;
const N2 = (v) => fmtN(v, 2);
const pt = (x) => Math.round(x * 10) / 10;

function fit(rw, rh, bx, by, bw, bh, maxEx = 1) {
  const s0 = Math.min(bw / rw, bh / rh);
  const sx = Math.min(bw / rw, s0 * maxEx), sy = Math.min(bh / rh, s0 * maxEx);
  const ox = bx + (bw - rw * sx) / 2, oy = by + (bh - rh * sy) / 2;
  return { sx, sy, X: (x) => pt(ox + x * sx), Y: (y) => pt(oy + y * sy), ox, oy, w: rw * sx, h: rh * sy, ex: sy / sx };
}
function dH(x1, x2, y, t, e1, e2) {
  let s = '';
  if (e1 != null) s += `<line class="ex" x1="${x1}" y1="${e1}" x2="${x1}" y2="${y + (y < e1 ? -3 : 3)}"/>`;
  if (e2 != null) s += `<line class="ex" x1="${x2}" y1="${e2 ?? e1}" x2="${x2}" y2="${y + (y < (e2 ?? e1) ? -3 : 3)}"/>`;
  s += `<line class="dm" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" marker-start="url(#ar)" marker-end="url(#ar)"/>`;
  s += `<text class="dt" x="${pt((x1 + x2) / 2)}" y="${y - 4}" text-anchor="middle">${t}</text>`;
  return s;
}
function dV(x, y1, y2, t, e1, e2, right) {
  let s = '';
  if (e1 != null) s += `<line class="ex" x1="${e1}" y1="${y1}" x2="${x + (x < e1 ? -3 : 3)}" y2="${y1}"/>`;
  if (e2 != null) s += `<line class="ex" x1="${e2}" y1="${y2}" x2="${x + (x < e2 ? -3 : 3)}" y2="${y2}"/>`;
  s += `<line class="dm" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" marker-start="url(#ar)" marker-end="url(#ar)"/>`;
  const tx = right ? x + 12 : x - 5;
  s += `<text class="dt" transform="translate(${pt(tx)},${pt((y1 + y2) / 2)}) rotate(-90)" text-anchor="middle">${t}</text>`;
  return s;
}
const rect = (x, y, w, h, cls, extra = '') => `<rect x="${pt(x)}" y="${pt(y)}" width="${pt(Math.max(0, w))}" height="${pt(Math.max(0, h))}" class="${cls}" ${extra}/>`;
const line = (x1, y1, x2, y2, cls, extra = '') => `<line x1="${pt(x1)}" y1="${pt(y1)}" x2="${pt(x2)}" y2="${pt(y2)}" class="${cls}" ${extra}/>`;
const text = (x, y, t, cls = 'lb', anchor = 'start', extra = '') => `<text x="${pt(x)}" y="${pt(y)}" class="${cls}" text-anchor="${anchor}" ${extra}>${t}</text>`;
const title = (x, y, t) => `<text x="${x}" y="${y}" class="vt">${t}</text>`;
const exNote = (f, x, y) => Math.abs(f.ex - 1) > 0.05 ? text(x, y, 'Düşey ölçek ×' + fmtN(f.ex, 1), 'lbs', 'end') : '';
const poly = (pts, cls) => `<polygon points="${pts.map(p => pt(p[0]) + ',' + pt(p[1])).join(' ')}" class="${cls}"/>`;
const pline = (pts, cls, extra = '') => `<polyline points="${pts.map(p => pt(p[0]) + ',' + pt(p[1])).join(' ')}" class="${cls}" ${extra}/>`;
const fig = (svg, cap) => `<figure class="dwg"><div class="dwg-scroll">${svg}</div><figcaption>${cap}</figcaption></figure>`;

// ---------- Izgara kanalı ----------
function drawScreen(d, name) {
  const W = 720, H = 500; let s = svgOpen(W, H, name);
  const t = 0.3, n = Math.min(d.N + d.Nsb, 4);
  const rw = d.L, rh = n * d.b + (n + 1) * t;
  const f = fit(rw, rh, 80, 50, 560, 170);
  s += title(16, 24, 'PLAN');
  for (let i = 0; i <= n; i++) s += rect(f.X(0), f.Y(i * (d.b + t)), f.w, t * f.sy, 'wl');
  const xs = d.L * 0.55;
  for (let i = 0; i < n; i++) {
    const y0 = t + i * (d.b + t);
    s += rect(f.X(0), f.Y(y0), f.w, d.b * f.sy, 'wt');
    s += line(f.X(xs), f.Y(y0), f.X(xs), f.Y(y0 + d.b), 'scr');
    const nb = Math.min(30, Math.max(4, Math.round(d.b * 1000 / (d.e + 10))));
    for (let j = 1; j < nb; j++) { const yy = f.Y(y0 + d.b * j / nb); s += line(f.X(xs) - 3, yy, f.X(xs) + 3, yy, 'ln'); }
    s += line(f.X(d.L * 0.08), f.Y(y0 + d.b / 2), f.X(d.L * 0.3), f.Y(y0 + d.b / 2), 'fl', 'marker-end="url(#af)"');
    s += text(f.X(d.L * 0.72), f.Y(y0 + d.b / 2) + 4, i < d.N ? 'Asil kanal ' + (i + 1) : 'Yedek kanal', 'lbs');
  }
  s += dH(f.X(0), f.X(d.L), f.Y(0) - 16, 'L = ' + N2(d.L) + ' m', f.Y(0), f.Y(0));
  s += dV(f.X(d.L) + 20, f.Y(t), f.Y(t + d.b), 'b = ' + N2(d.b) + ' m', f.X(d.L), f.X(d.L), true);
  if (d.N + d.Nsb > n) s += text(W - 16, 24, `${d.N + d.Nsb} kanaldan ${n} tanesi gösterildi`, 'lbs', 'end');
  // Kesit
  s += title(16, 270, 'BOYUNA KESİT');
  const slab = 0.3, rh2 = d.H + slab;
  const g = fit(d.L, rh2, 80, 290, 560, 170, 3);
  s += rect(g.X(0), g.Y(d.H), g.w, slab * g.sy, 'wl');
  s += rect(g.X(0), g.Y(0), g.w, d.H * g.sy, 'ln bg');
  s += rect(g.X(0), g.Y(d.H - d.h), g.w, d.h * g.sy, 'wt');
  s += line(g.X(0), g.Y(d.H - d.h), g.X(d.L), g.Y(d.H - d.h), 'ws');
  const th = d.th * Math.PI / 180, dx = d.H / Math.tan(th);
  s += line(g.X(xs), g.Y(d.H), g.X(xs + dx), g.Y(0) - 14, 'scr');
  s += text(g.X(xs + dx) + 6, g.Y(0) - 8, 'θ = ' + d.th + '°', 'lbs');
  s += text(g.X(xs) + 8, g.Y(d.H) - 6, 'e = ' + d.e + ' mm', 'lbs');
  s += line(g.X(d.L * 0.05), g.Y(d.H - d.h / 2), g.X(d.L * 0.25), g.Y(d.H - d.h / 2), 'fl', 'marker-end="url(#af)"');
  s += dV(g.X(0) - 14, g.Y(d.H - d.h), g.Y(d.H), 'h = ' + N2(d.h), g.X(0), g.X(0));
  s += dV(g.X(0) - 44, g.Y(0), g.Y(d.H), 'H = ' + N2(d.H), g.X(0), g.X(0));
  s += dH(g.X(0), g.X(d.L), g.Y(rh2) + 22, 'L = ' + N2(d.L) + ' m', g.Y(rh2), g.Y(rh2));
  s += exNote(g, W - 16, 486);
  return fig(s + '</svg>', name + ' — plan ve boyuna kesit (ölçüler m)');
}

// ---------- Pompa istasyonu ----------
function drawPump(d, name) {
  const W = 720, H = 520; let s = svgOpen(W, H, name);
  const t = 0.3;
  s += title(16, 24, 'PLAN (bir bölme)');
  const f = fit(d.L + 2 * t, d.W + 2 * t, 90, 40, 540, 170);
  s += rect(f.X(0), f.Y(0), f.w, f.h, 'wl');
  s += rect(f.X(t), f.Y(t), d.L * f.sx, d.W * f.sy, 'wt');
  const n = d.n, sp = d.L / n;
  for (let i = 0; i < n; i++) {
    const cx = f.X(t + sp * (i + 0.5)), cy = f.Y(t + d.W * 0.62), r = Math.max(5, 0.4 * f.sx);
    s += `<circle cx="${cx}" cy="${cy}" r="${pt(r)}" class="eq"/>` + text(cx, cy + r + 12, i < d.nd / d.nc ? 'P' + (i + 1) : 'Y', 'lbs', 'middle');
  }
  s += line(f.X(0) - 30, f.Y(t + d.W * 0.2), f.X(t) + 20, f.Y(t + d.W * 0.2), 'fl', 'marker-end="url(#af)"') + text(f.X(0) - 30, f.Y(t + d.W * 0.2) - 6, 'Giriş', 'lbs');
  s += dH(f.X(t), f.X(t + d.L), f.Y(0) - 14, 'L = ' + N2(d.L) + ' m', f.Y(t), f.Y(t));
  s += dV(f.X(d.L + 2 * t) + 18, f.Y(t), f.Y(t + d.W), 'W = ' + N2(d.W) + ' m', f.X(d.L + t), f.X(d.L + t), true);
  if (d.nc > 1) s += text(W - 16, 24, d.nc + ' bölme', 'lbs', 'end');
  // Kesit
  s += title(16, 270, 'KESİT');
  const Ht = d.hd + d.hu + d.hf, slab = 0.4;
  const g = fit(d.L + 2 * t, Ht + slab, 110, 290, 480, 200, 2.5);
  s += rect(g.X(0), g.Y(0), t * g.sx, Ht * g.sy, 'wl') + rect(g.X(d.L + t), g.Y(0), t * g.sx, Ht * g.sy, 'wl');
  s += rect(g.X(0), g.Y(Ht), g.w, slab * g.sy, 'wl');
  s += rect(g.X(t), g.Y(d.hf), d.L * g.sx, (d.hd + d.hu) * g.sy, 'wt');
  const yStart = d.hf, yStop = d.hf + d.hu;
  s += line(g.X(t), g.Y(yStart), g.X(d.L + t), g.Y(yStart), 'ws') + text(g.X(d.L + t) - 4, g.Y(yStart) - 4, 'Çalıştırma seviyesi', 'lbs', 'end');
  s += line(g.X(t), g.Y(yStop), g.X(d.L + t), g.Y(yStop), 'lnd') + text(g.X(d.L + t) - 4, g.Y(yStop) - 4, 'Durdurma seviyesi', 'lbs', 'end');
  for (let i = 0; i < n; i++) {
    const cx = g.X(t + sp * (i + 0.5)), pw = Math.max(8, 0.6 * g.sx), ph = Math.max(10, 0.9 * g.sy);
    s += rect(cx - pw / 2, g.Y(Ht) - ph, pw, ph, 'eq') + line(cx, g.Y(Ht) - ph, cx, g.Y(0) - 6, 'ln');
  }
  s += `<circle cx="${g.X(t) - 2}" cy="${g.Y(d.hf * 0.55)}" r="${pt(Math.max(5, 0.35 * g.sy))}" class="eq"/>` + text(g.X(0) - 8, g.Y(d.hf * 0.55) + 4, 'Giriş', 'lbs', 'end');
  const xr = g.X(d.L + 2 * t) + 16;
  s += dV(xr, g.Y(0), g.Y(d.hf), 'h = ' + N2(d.hf), null, null, true);
  s += dV(xr, g.Y(d.hf), g.Y(d.hf + d.hu), 'Δh = ' + N2(d.hu), null, null, true);
  s += dV(xr, g.Y(d.hf + d.hu), g.Y(Ht), 'h₀ = ' + N2(d.hd), null, null, true);
  s += dV(xr + 50, g.Y(0), g.Y(Ht), 'H = ' + N2(Ht), null, null, true);
  s += dH(g.X(t), g.X(d.L + t), g.Y(Ht + slab) + 22, 'L = ' + N2(d.L), g.Y(Ht + slab), g.Y(Ht + slab));
  s += exNote(g, W - 16, 510);
  return fig(s + '</svg>', name + ' — plan ve kesit (ölçüler m)');
}

// ---------- Havalandırmalı kum-yağ tutucu ----------
function drawGrit(d, name) {
  const W = 720, H = 560; let s = svgOpen(W, H, name);
  const t = d.tw, fb = 0.5, slab = 0.35;
  const Wl = t + d.bF + t + d.b + t, Ht = d.h + fb;
  s += title(16, 24, 'ENKESİT (bir hat)');
  const f = fit(Wl, Ht + slab + 0.6, 120, 50, 480, 270);
  const x0 = 0, xg0 = t, xb = t + d.bF, xs0 = xb + t, xs1 = xs0 + d.b;
  const yW = fb, yBot = fb + d.h, ySl = fb + d.h - 0.25 * d.b;
  // duvarlar
  s += rect(f.X(0), f.Y(0), t * f.sx, (Ht + slab) * f.sy, 'wl') + rect(f.X(xs1), f.Y(0), t * f.sx, (Ht + 0.6 + slab) * f.sy, 'wl');
  // su
  const gw = Math.min(0.5, 0.15 * d.b);
  s += poly([[xg0, yW], [xs1, yW], [xs1, yBot + 0.6], [xs1 - gw, yBot + 0.6], [xs1 - gw, yBot], [xs0, ySl], [xg0, ySl]].map(p => [f.X(p[0]), f.Y(p[1])]), 'wt');
  s += line(f.X(xg0), f.Y(yW), f.X(xs1), f.Y(yW), 'ws');
  // taban
  s += poly([[0, ySl], [xs0, ySl], [xs1 - gw, yBot], [xs1 - gw, yBot + 0.6], [xs1 + t, yBot + 0.6], [xs1 + t, yBot + 0.6 + slab], [0, ySl + slab]].map(p => [f.X(p[0]), f.Y(p[1])]), 'wl');
  // ayırma perdesi
  s += rect(f.X(xb), f.Y(0), t * f.sx, (fb + d.h * 0.55) * f.sy, 'wl');
  // difüzör ve kabarcıklar
  const dy = yBot - 0.35, dxp = xs1 - gw - 0.25;
  s += `<circle cx="${f.X(dxp)}" cy="${f.Y(dy)}" r="5" class="eq"/>`;
  for (let i = 0; i < 9; i++) s += `<circle cx="${pt(f.X(dxp) - 4 - (i % 3) * 7)}" cy="${pt(f.Y(dy) - 14 - i * (f.Y(yBot) - f.Y(yW)) / 11)}" r="${2 + (i % 2)}" class="bub"/>`;
  s += `<path d="M${f.X(xs1 - 0.4)},${f.Y(yW + 0.5)} C${f.X(xs0 + 0.3)},${f.Y(yW + 0.2)} ${f.X(xs0 + 0.2)},${f.Y(ySl - 0.3)} ${f.X(xs1 - 0.8)},${f.Y(ySl)}" class="roll" marker-end="url(#af)"/>`;
  s += text(f.X(xg0 + d.bF / 2), f.Y(yW + 0.5), 'Yağ', 'lbs', 'middle') + text(f.X(xs0 + d.b / 2), f.Y(yW + 0.5), 'Kum', 'lbs', 'middle');
  s += text(f.X(xs1 - gw / 2), f.Y(yBot + 0.6) + 14, 'Kum oluğu', 'lbs', 'middle');
  s += dH(f.X(xg0), f.X(xb), f.Y(0) - 14, 'b_FF = ' + N2(d.bF), f.Y(yW), f.Y(yW));
  s += dH(f.X(xs0), f.X(xs1), f.Y(0) - 14, 'b_SF = ' + N2(d.b), f.Y(yW), f.Y(yW));
  s += dH(f.X(0), f.X(xs1 + t), f.Y(0) - 36, 'Hat genişliği = ' + N2(Wl));
  s += dV(f.X(xs1 + t) + 22, f.Y(yW), f.Y(yBot), 'h = ' + N2(d.h), f.X(xs1 + t), f.X(xs1 + t), true);
  // Plan
  s += title(16, 360, 'PLAN');
  const n = Math.min(d.N, 4), Wp = n * (Wl - t) + t;
  const g = fit(d.L, Wp, 100, 380, 520, 140);
  for (let i = 0; i < n; i++) {
    const y = i * (Wl - t);
    s += rect(g.X(0), g.Y(y), g.w, t * g.sy, 'wl');
    s += rect(g.X(0), g.Y(y + t), g.w, d.bF * g.sy, 'wt op5');
    s += line(g.X(0), g.Y(y + t + d.bF + t / 2), g.X(d.L), g.Y(y + t + d.bF + t / 2), 'lnd');
    s += rect(g.X(0), g.Y(y + 2 * t + d.bF), g.w, d.b * g.sy, 'wt');
  }
  s += rect(g.X(0), g.Y(Wp - t), g.w, t * g.sy, 'wl');
  s += line(g.X(-d.L * 0.08), g.Y(Wp / 2), g.X(0), g.Y(Wp / 2), 'fl', 'marker-end="url(#af)"');
  s += dH(g.X(0), g.X(d.L), g.Y(Wp) + 22, 'L = ' + N2(d.L) + ' m', g.Y(Wp), g.Y(Wp));
  if (d.N > n) s += text(W - 16, 360, `${d.N} hattan ${n} tanesi gösterildi`, 'lbs', 'end');
  return fig(s + '</svg>', name + ' — enkesit ve plan (ölçüler m)');
}

// ---------- Dairesel havuz (ön/son çöktürme, yoğunlaştırıcı) ----------
function drawCircular(d, name) {
  const W = 720, H = 400; let s = svgOpen(W, H, name);
  const R = d.D / 2, t = 0.4, Din = d.Din || 0;
  s += title(16, 24, 'PLAN');
  const f = fit(d.D + 2 * t, d.D + 2 * t, 24, 50, 220, 220);
  const cx = f.X(R + t), cy = f.Y(R + t), rp = R * f.sx, rt = (R + t) * f.sx;
  s += `<path d="M${cx - rt},${cy}a${rt},${rt} 0 1,0 ${2 * rt},0a${rt},${rt} 0 1,0 ${-2 * rt},0zM${cx - rp},${cy}a${rp},${rp} 0 1,1 ${2 * rp},0a${rp},${rp} 0 1,1 ${-2 * rp},0z" class="wl" fill-rule="evenodd"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${pt(rp)}" class="wt"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${pt(rp - 0.5 * f.sx)}" class="lnd"/>`;
  if (Din) s += `<circle cx="${cx}" cy="${cy}" r="${pt(Din / 2 * f.sx)}" class="eq"/>`;
  s += rect(cx, cy - 0.6 * f.sx, rp, 1.2 * f.sx, 'brg');
  s += text(cx + rp * 0.5, cy - 1.2 * f.sx - 4, 'köprü', 'lbs', 'middle');
  s += dH(cx - rp, cx + rp, cy + rt + 22, 'D = ' + N2(d.D) + ' m', cy, cy);
  if (Din) s += text(cx, cy + rt + 44, 'Giriş yapısı Ø' + N2(Din) + ' m', 'lbs', 'middle');
  if (d.N > 1) s += text(30, 44, d.N + ' adet', 'lbs');
  // Kesit
  s += title(270, 24, 'KESİT');
  const fb = 0.5, hop = Math.max(0.8, 0.12 * d.D * 0.1 + 0.8), rh0 = 1.0;
  const hS = d.h, hC = hS + d.slope * (R - rh0);
  const Ht = fb + hC + hop + 0.4;
  const g = fit(d.D + 2 * t, Ht, 300, 56, 380, 250, 3);
  const X = (x) => g.X(x + R + t), Y = (y) => g.Y(y + fb);
  const bot = [[-R, hS], [-rh0, hC], [-0.5, hC + hop], [0.5, hC + hop], [rh0, hC], [R, hS]];
  s += poly([[-R, 0], [R, 0], ...bot.slice().reverse()].map(p => [X(p[0]), Y(p[1])]), 'wt');
  s += line(X(-R), Y(0), X(R), Y(0), 'ws');
  s += poly([...bot, [R, hS + 0.4], ...bot.slice().reverse().map(p => [p[0], p[1] + 0.4])].map(p => [X(p[0]), Y(p[1])]), 'wl');
  s += rect(X(-R - t), Y(-fb), t * g.sx, (hS + fb + 0.4) * g.sy, 'wl') + rect(X(R), Y(-fb), t * g.sx, (hS + fb + 0.4) * g.sy, 'wl');
  if (Din) s += line(X(-Din / 2), Y(-0.3), X(-Din / 2), Y(hS * 0.4), 'ln') + line(X(Din / 2), Y(-0.3), X(Din / 2), Y(hS * 0.4), 'ln');
  s += rect(X(-R + 0.1), Y(-0.1), 0.4 * g.sx, 0.4 * g.sy, 'eq') + rect(X(R - 0.5), Y(-0.1), 0.4 * g.sx, 0.4 * g.sy, 'eq');
  if (d.bands) {
    const xb = X(-2 * R / 3);
    let y = 0; const nm = ['h₁', 'h₂', 'h₃', 'h₄'];
    d.bands.forEach((hh, i) => {
      s += rect(xb - 7, Y(y), 14, hh * g.sy, 'band b' + (i + 1));
      s += text(xb + 12, Y(y + hh / 2) + 4, nm[i] + ' = ' + N2(hh), 'lbs');
      y += hh;
    });
    s += line(xb, Y(0), xb, Y(d.H), 'lnd');
    s += dV(xb - 16, Y(0), Y(d.H), 'h_top = ' + N2(d.H), null, null);
    s += text(xb, Y(d.H) + 14, '2/3 R', 'lbs', 'middle');
  }
  s += dV(X(R + t) + 18, Y(0), Y(hS), 'h = ' + N2(hS), X(R), X(R), true);
  s += dV(X(Din ? Din / 2 : 0) + 18, Y(0), Y(hC), 'h_m = ' + N2(hC), null, null, true);
  s += dH(X(-R), X(R), Y(-fb) - 14, 'D = ' + N2(d.D) + ' m', Y(-fb), Y(-fb));
  s += text(X(R * 0.55), Y(hS + d.slope * R * 0.45) + 20, 'eğim ' + fmtN(d.slope * 100, 1) + '%', 'lbs', 'middle');
  s += exNote(g, W - 16, 330);
  return fig(s + '</svg>', name + ' — plan ve kesit (ölçüler m)');
}

// ---------- Dikdörtgen havuz (biyolojik, anaerobik, depo) ----------
const ZCLS = { AN: 'zAN', AX: 'zAX', OX: 'zOX', SIM: 'zSIM', INT: 'zINT', ST: 'zST' };
function drawRect(d, name) {
  const W = 720, H = 540; let s = svgOpen(W, H, name);
  const t = 0.4, fb = d.fb || 0.5, Ht = d.h + fb, slab = 0.4;
  s += title(16, 24, 'PLAN' + (d.N > 1 ? ' (bir havuz, toplam ' + d.N + ' adet)' : ''));
  const f = fit(d.L + 2 * t, d.W + 2 * t, 70, 50, 580, 220);
  s += rect(f.X(0), f.Y(0), f.w, f.h, 'wl');
  let x = t;
  d.zones.forEach((z, i) => {
    const zl = d.L * z.f;
    s += rect(f.X(x), f.Y(t), zl * f.sx, d.W * f.sy, ZCLS[z.t] || 'wt');
    if (z.t === 'OX' && !d.noDiff) {
      const nx = Math.max(2, Math.floor(zl * f.sx / 12)), ny = Math.max(2, Math.floor(d.W * f.sy / 12));
      for (let a = 0; a < nx; a++) for (let b = 0; b < ny; b++) s += `<circle cx="${pt(f.X(x) + (a + 0.5) * zl * f.sx / nx)}" cy="${pt(f.Y(t) + (b + 0.5) * d.W * f.sy / ny)}" r="1.6" class="df"/>`;
    }
    if (z.t === 'AN' || z.t === 'AX') s += `<g class="mix"><circle cx="${pt(f.X(x + zl / 2))}" cy="${pt(f.Y(t + d.W * 0.75))}" r="6"/><line x1="${pt(f.X(x + zl / 2) - 8)}" y1="${pt(f.Y(t + d.W * 0.75))}" x2="${pt(f.X(x + zl / 2) + 8)}" y2="${pt(f.Y(t + d.W * 0.75))}"/></g>`;
    if (zl * f.sx > 36) {
      s += text(f.X(x + zl / 2), f.Y(t + d.W * 0.32), z.n, 'lbz', 'middle');
      s += text(f.X(x + zl / 2), f.Y(t + d.W * 0.32) + 14, fmtN(z.V / (d.N || 1), 0) + ' m³', 'lbs', 'middle');
    }
    if (i > 0) s += rect(f.X(x) - 1.5, f.Y(t), 3, d.W * f.sy, 'part');
    if (zl * f.sx > 50) s += dH(f.X(x), f.X(x + zl), f.Y(d.W + 2 * t) + 18, N2(zl), f.Y(d.W + 2 * t), f.Y(d.W + 2 * t));
    x += zl;
  });
  s += line(f.X(0) - 34, f.Y(t + d.W * 0.5), f.X(t) + 6, f.Y(t + d.W * 0.5), 'fl', 'marker-end="url(#af)"');
  s += line(f.X(d.L + t) - 6, f.Y(t + d.W * 0.5), f.X(d.L + 2 * t) + 30, f.Y(t + d.W * 0.5), 'fl', 'marker-end="url(#af)"');
  s += dH(f.X(t), f.X(d.L + t), f.Y(0) - 14, 'L = ' + N2(d.L) + ' m', f.Y(t), f.Y(t));
  s += dV(f.X(d.L + 2 * t) + 44, f.Y(t), f.Y(d.W + t), 'W = ' + N2(d.W) + ' m', f.X(d.L + 2 * t), f.X(d.L + 2 * t), true);
  // Kesit
  s += title(16, 330, 'BOYUNA KESİT');
  const g = fit(d.L + 2 * t, Ht + slab, 70, 350, 580, 150, 4);
  s += rect(g.X(0), g.Y(0), t * g.sx, (Ht + slab) * g.sy, 'wl') + rect(g.X(d.L + t), g.Y(0), t * g.sx, (Ht + slab) * g.sy, 'wl');
  s += rect(g.X(0), g.Y(Ht), g.w, slab * g.sy, 'wl');
  x = t;
  d.zones.forEach((z, i) => {
    const zl = d.L * z.f;
    s += rect(g.X(x), g.Y(fb), zl * g.sx, d.h * g.sy, ZCLS[z.t] || 'wt');
    if (z.t === 'OX' && !d.noDiff) s += line(g.X(x) + 3, g.Y(Ht) - 4, g.X(x + zl) - 3, g.Y(Ht) - 4, 'dfl');
    if (i > 0) s += line(g.X(x), g.Y(fb) - 4, g.X(x), g.Y(Ht), 'lnd');
    x += zl;
  });
  s += line(g.X(t), g.Y(fb), g.X(d.L + t), g.Y(fb), 'ws');
  s += dV(g.X(d.L + 2 * t) + 16, g.Y(fb), g.Y(Ht), 'h = ' + N2(d.h), g.X(d.L + t), g.X(d.L + t), true);
  s += dV(g.X(d.L + 2 * t) + 52, g.Y(0), g.Y(Ht), 'H = ' + N2(Ht), g.X(d.L + 2 * t), g.X(d.L + 2 * t), true);
  s += dH(g.X(t), g.X(d.L + t), g.Y(Ht + slab) + 20, 'L = ' + N2(d.L) + ' m', g.Y(Ht + slab), g.Y(Ht + slab));
  s += exNote(g, W - 16, 530);
  return fig(s + '</svg>', name + ' — plan ve boyuna kesit (ölçüler m)');
}

// ---------- Düşey silindirik tank / silo ----------
function drawTankV(d, name) {
  const W = 720, H = 360; let s = svgOpen(W, H, name);
  const cone = d.silo ? d.D * 0.5 : 0, legs = d.silo ? 3.0 : 0;
  const Ht = d.H + cone + legs + 0.4;
  s += title(16, 24, 'GÖRÜNÜŞ');
  const f = fit(d.D + 2, Ht, 120, 40, 300, 290);
  const X = (x) => f.X(x + 1), Y = (y) => f.Y(y);
  const yTop = 0, yBot = d.H, D = d.D;
  s += rect(X(0), Y(yTop), D * f.sx, d.H * f.sy, 'eq');
  s += rect(X(0), Y(d.H - d.h), D * f.sx, d.h * f.sy, d.silo ? 'cake' : 'chem');
  s += line(X(0), Y(d.H - d.h), X(D), Y(d.H - d.h), 'ws');
  if (d.silo) {
    s += poly([[X(0), Y(yBot)], [X(D), Y(yBot)], [X(D / 2 + 0.4), Y(yBot + cone)], [X(D / 2 - 0.4), Y(yBot + cone)]], 'cake');
    s += line(X(0.1), Y(yBot), X(0.1), Y(yBot + cone + legs), 'ln') + line(X(D - 0.1), Y(yBot), X(D - 0.1), Y(yBot + cone + legs), 'ln');
    s += text(X(D / 2), Y(yBot + cone + legs * 0.6), 'kamyon yükleme', 'lbs', 'middle');
  }
  s += rect(X(-0.5), Y(yBot + cone + legs), (D + 1) * f.sx, 0.4 * f.sy, 'wl');
  s += dH(X(0), X(D), Y(0) - 14, 'Ø = ' + N2(D) + ' m', Y(0), Y(0));
  s += dV(X(D) + 20, Y(d.H - d.h), Y(d.H), 'h = ' + N2(d.h), X(D), X(D), true);
  s += dV(X(0) - 18, Y(0), Y(d.H), 'H = ' + N2(d.H), X(0), X(0));
  s += title(460, 24, 'PLAN');
  const n = Math.min(d.N, 4), rr = Math.min(50, 220 / (n * 2.4));
  for (let i = 0; i < n; i++) {
    const cx = 480 + rr + i * rr * 2.5, cy = 140;
    s += `<circle cx="${pt(cx)}" cy="${cy}" r="${pt(rr)}" class="eq"/>` + text(cx, cy + 4, String(i + 1), 'lbs', 'middle');
  }
  s += text(480, 140 + rr + 24, d.N + ' adet × Ø' + N2(D) + ' m', 'lbs');
  return fig(s + '</svg>', name + ' — görünüş ve plan (ölçüler m)');
}

// ---------- UV kanalı ----------
function drawUV(d, name) {
  const W = 720, H = 460; let s = svgOpen(W, H, name);
  const t = 0.3, n = Math.min(d.N, 3);
  s += title(16, 24, 'PLAN');
  const Wp = n * d.b + (n + 1) * t;
  const f = fit(d.L, Wp, 70, 50, 580, 150);
  for (let i = 0; i <= n; i++) s += rect(f.X(0), f.Y(i * (d.b + t)), f.w, t * f.sy, 'wl');
  for (let i = 0; i < n; i++) {
    const y0 = t + i * (d.b + t);
    s += rect(f.X(0), f.Y(y0), f.w, d.b * f.sy, 'wt');
    for (let k = 0; k < d.banks; k++) {
      const x0 = d.Lio / 2 + k * d.Lb + 0.2;
      s += rect(f.X(x0), f.Y(y0 + 0.03), (d.Lb - 0.4) * f.sx, (d.b - 0.06) * f.sy, 'uvb');
      const m = Math.min(d.mods, 12);
      for (let j = 0; j < m; j++) { const yy = f.Y(y0 + 0.05 + (d.b - 0.1) * (j + 0.5) / m); s += line(f.X(x0) + 3, yy, f.X(x0 + d.Lb - 0.4) - 3, yy, 'lamp'); }
    }
    s += line(f.X(0.2), f.Y(y0 + d.b / 2), f.X(d.Lio / 2 - 0.3), f.Y(y0 + d.b / 2), 'fl', 'marker-end="url(#af)"');
  }
  s += dH(f.X(0), f.X(d.L), f.Y(0) - 14, 'L = ' + N2(d.L) + ' m', f.Y(0), f.Y(0));
  s += dV(f.X(d.L) + 18, f.Y(t), f.Y(t + d.b), 'b = ' + N2(d.b), f.X(d.L), f.X(d.L), true);
  s += title(16, 250, 'ENKESİT (bir kanal)');
  const g = fit(d.b + 2 * t, d.h + 0.5 + 0.3, 200, 270, 320, 170);
  s += rect(g.X(0), g.Y(0), t * g.sx, (d.h + 0.8) * g.sy, 'wl') + rect(g.X(d.b + t), g.Y(0), t * g.sx, (d.h + 0.8) * g.sy, 'wl');
  s += rect(g.X(0), g.Y(d.h + 0.5), (d.b + 2 * t) * g.sx, 0.3 * g.sy, 'wl');
  s += rect(g.X(t), g.Y(0.5), d.b * g.sx, d.h * g.sy, 'wt') + line(g.X(t), g.Y(0.5), g.X(d.b + t), g.Y(0.5), 'ws');
  const m = Math.min(d.mods, 24), r = Math.max(1.5, Math.min(4, 0.012 * g.sx));
  for (let j = 0; j < m; j++) for (let k = 0; k < d.lpm; k++) s += `<circle cx="${pt(g.X(t + 0.05 + (j + 0.5) * (d.b - 0.1) / m))}" cy="${pt(g.Y(0.5 + 0.05 + (k + 0.5) * d.sp))}" r="${pt(r)}" class="lampc"/>`;
  s += dH(g.X(t), g.X(d.b + t), g.Y(0) - 12, 'b = ' + N2(d.b), g.Y(0.5), g.Y(0.5));
  s += dV(g.X(d.b + 2 * t) + 18, g.Y(0.5), g.Y(d.h + 0.5), 'h = ' + N2(d.h), g.X(d.b + t), g.X(d.b + t), true);
  s += text(g.X(0) - 10, g.Y(0.5 + d.h / 2), d.mods + ' modül × ' + d.lpm + ' lamba', 'lbs', 'end');
  return fig(s + '</svg>', name + ' — plan ve enkesit (ölçüler m)');
}

// ---------- Proses şeması ----------
function drawScheme(res) {
  const B = res.BIO, sys = res.sys, s0 = res.R.sc ? 1 : 1;
  const W = 760, H = 300; let s = svgOpen(W, H, 'Proses şeması');
  const Q = res.ctx.Qd;
  const boxes = [];
  const zl = B.zones.map(z => ({ t: z.t, n: z.n, V: z.V }));
  if (sys.jhb) { boxes.push(zl.shift()); }
  if (sys.an) boxes.push({ t: 'AN', n: 'Anaerobik', V: B.Van || 0 });
  boxes.push(...zl);
  const n = boxes.length, bw = Math.min(130, 560 / n - 10), gap = 10, x0 = 60, y0 = 80, bh = 80;
  const bx = (i) => x0 + i * (bw + gap);
  const scx = bx(n) + 50, scy = y0 + bh / 2;
  boxes.forEach((b, i) => {
    s += rect(bx(i), y0, bw, bh, (ZCLS[b.t] || 'wt') + ' sbx', 'rx="4"');
    s += text(bx(i) + bw / 2, y0 + 30, b.n, 'lbz', 'middle');
    s += text(bx(i) + bw / 2, y0 + 48, b.V ? fmtN(b.V, 0) + ' m³' : '', 'lbs', 'middle');
    s += text(bx(i) + bw / 2, y0 + 64, b.V ? fmtN(b.V / Q * 24, 1) + ' h' : '', 'lbs', 'middle');
    if (i < n - 1) s += line(bx(i) + bw, y0 + bh / 2, bx(i + 1), y0 + bh / 2, 'fl', 'marker-end="url(#af)"');
  });
  s += line(bx(n - 1) + bw, scy, scx - 26, scy, 'fl', 'marker-end="url(#af)"');
  s += `<circle cx="${scx}" cy="${scy}" r="26" class="eq"/>` + text(scx, scy + 4, 'SÇ', 'lbz', 'middle');
  s += line(scx + 26, scy, W - 12, scy, 'fl', 'marker-end="url(#af)"') + text(W - 14, scy - 8, 'Çıkış', 'lbs', 'end');
  // giriş
  const ii = sys.jhb ? 1 : 0;
  s += line(bx(ii) + bw / 2, 22, bx(ii) + bw / 2, y0, 'fl', 'marker-end="url(#af)"') + text(bx(ii) + bw / 2 + 6, 30, 'Giriş Q', 'lbs');
  // devirler
  const idx = (pred) => boxes.findIndex(pred);
  const recs = [];
  const rasTo = sys.jhb ? 0 : (sys.anIn === 'R' ? idx(b => b.t === 'AX') : 0);
  recs.push({ from: 'SC', to: rasTo, lab: 'RAS · RV = ' + fmtN(res.P.sc.RV, 2), cls: 'rec ras', lvl: 3 });
  if (sys.ir) {
    const ox = idx(b => b.t === 'OX');
    const ax = sys.muct ? idx((b, i) => b.t === 'AX' && i > idx(c => c.t === 'AX')) : idx(b => b.t === 'AX' && !/Ön/.test(b.n));
    recs.push({ from: ox, to: ax, lab: 'IR = ' + fmtN(B.IR, 2) + '·Q', cls: 'rec ir', lvl: 1 });
  }
  if (sys.anIn === 'R') recs.push({ from: idx(b => b.t === 'AX'), to: idx(b => b.t === 'AN'), lab: 'r = ' + fmtN(res.P.bio.rU, 2) + '·Q', cls: 'rec rr', lvl: 2, up: true });
  recs.forEach(r => {
    const yl = y0 + bh + 18 + r.lvl * 26;
    const xf = r.from === 'SC' ? scx : bx(r.from) + bw * 0.7;
    const yf = r.from === 'SC' ? scy + 26 : y0 + bh;
    const xt = bx(r.to) + bw * (r.lvl === 1 ? 0.5 : 0.3);
    s += pline([[xf, yf], [xf, yl], [xt, yl], [xt, y0 + bh]], r.cls, 'marker-end="url(#af)"');
    s += text((xf + xt) / 2, yl - 5, r.lab, 'lbs', 'middle');
  });
  s += line(scx, scy + 26, scx, scy + 26, 'ln');
  s += line(scx + 18, scy + 18, scx + 50, H - 20, 'fl', 'marker-end="url(#af)"') + text(scx + 54, H - 22, 'Fazla çamur', 'lbs');
  return fig(s + '</svg>', sys.n + ' — proses şeması (hacimler toplam, süreler Q_DW,d’ye göre)');
}

function drawUnit(u, o, name) {
  const d = o.dim; if (!d) return '';
  try {
    if (u === 'cs' || u === 'fs') return drawScreen(d, name);
    if (u === 'ps') return drawPump(d, name);
    if (u === 'gr') return drawGrit(d, name);
    if (u === 'pc') return d.circ ? drawCircular(d, name) : drawRect({ L: d.L, W: d.W, h: d.h, fb: 0.5, N: d.N, zones: [{ t: 'ST', n: 'Çöktürme', f: 1, V: d.L * d.W * d.h }], noDiff: true }, name);
    if (u === 'sc' || u === 'pt') return drawCircular(d, name);
    if (u === 'bio' || u === 'an' || u === 'et') return drawRect(d, name);
    if (u === 'cp' || u === 'dw') return drawTankV(d, name);
    if (u === 'uv') return drawUV(d, name);
  } catch (e) { return `<p class="err">Çizim oluşturulamadı: ${e.message}</p>`; }
  return '';
}

const LS = 'atv131-proses-v2';
function defaultState() {
  return {
    project: { name: 'West Benghazi AAT (örnek)', loc: 'Bingazi', eng: '', note: 'Örnek veriler West Benghazi proses raporundan alınmıştır.' },
    system: 'A2O',
    units: { cs: true, ps: true, fs: true, gr: true, pc: true, cp: true, an: true, bio: true, sc: true, pt: true, et: true, dw: true, uv: false },
    scen: [sampleScenario(1), sampleScenario(2)], act: 0, page: 'home',
  };
}
function loadState() {
  try { const t = localStorage.getItem(LS); if (t) { const o = JSON.parse(t); if (o && o.scen && o.scen.length) return o; } } catch (e) { }
  return null;
}
let S = loadState() || defaultState();
let saveT = null;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { } }, 250); }
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const $ = (q) => document.querySelector(q);
const sc = () => S.scen[S.act];

function unitList(res) { return ORDER.filter(u => res.U[u]); }
function fails(o) { if (!o) return 0; return (o.warn ? o.warn.length : 0) + o.rows.filter(r => r.c && !r.c.ok).length; }

// ---------- Kabuk ----------
function renderShell() {
  const res = compute(S, sc());
  const pages = [['home', 'Proje ve Ünite Seçimi', '0'], ['data', 'Tasarım Verileri', '1'], ['sys', 'Proses Sistemi', '2']];
  unitList(res).forEach(u => pages.push([u, UNITS[u].n, UNITS[u].c]));
  pages.push(['sum', 'Özet Tablo', 'Σ'], ['rep', 'Tüm Rapor', '≡']);
  if (!pages.find(p => p[0] === S.page)) S.page = 'home';
  $('#nav').innerHTML = pages.map(([k, n, c]) => {
    const fl = UNITS[k] ? fails(res.R[k]) : 0;
    return `<button class="nv ${S.page === k ? 'on' : ''}" data-page="${k}"><span class="nc">${c}</span><span class="nn">${n}</span>${fl ? `<span class="nf" title="${fl} kontrol uyarısı">${fl}</span>` : ''}</button>`;
  }).join('');
  $('#scsel').innerHTML = S.scen.map((x, i) => `<option value="${i}" ${i === S.act ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  $('#pname').textContent = S.project.name || 'Adsız proje';
  $('#syslab').textContent = SYS[S.system].n;
  renderPage(res);
}
function renderPage(res) {
  res = res || compute(S, sc());
  const p = S.page; let h = '';
  if (p === 'home') h = pageHome(res);
  else if (p === 'data') h = pageData(res);
  else if (p === 'sys') h = pageSys(res);
  else if (p === 'sum') h = pageSum(res);
  else if (p === 'rep') h = pageRep(res);
  else if (UNITS[p]) h = pageUnit(p, res);
  $('#main').innerHTML = h;
}

// ---------- Sayfa: proje ----------

  }).join('');

  </div></div>
  <div class="card"><h2>Senaryolar / kademeler</h2><p class="hint">Her kademe kendi debisini, yükünü ve ünite parametrelerini taşır. Üst çubuktan etkin kademeyi değiştirin.</p>
    <div class="scl">${S.scen.map((x, i) => `<div class="sci ${i === S.act ? 'on' : ''}"><input type="text" data-scname="${i}" value="${esc(x.name)}" aria-label="Kademe adı"><button class="btn sm" data-act="${i}">Etkin yap</button><button class="btn sm ghost" data-dup="${i}">Kopyala</button>${S.scen.length > 1 ? `<button class="btn sm ghost danger" data-del="${i}">Sil</button>` : ''}</div>`).join('')}</div>

  <div class="card"><h2>Proje dosyası</h2><p class="hint">Tüm girdileri .json olarak kaydedip sonra geri yükleyebilirsiniz. Tarayıcı da çalışmanızı otomatik saklar.</p>

    <div id="resetAsk" hidden class="ask">Tüm girdiler silinip örnek veriler yüklenecek. <button class="btn sm danger" id="bResetYes">Evet, sıfırla</button> <button class="btn sm ghost" id="bResetNo">Vazgeç</button></div>
  </div></section>`;
}
const txt = (path, l, v) => `<label class="fld" for="t_${path}"><span class="fl-l">${l}</span><span class="fl-i"><input type="text" id="t_${path}" data-bind="${path}" value="${esc(v)}"></span></label>`;

// ---------- Sayfa: veriler ----------
function pageData(res) {

    `<label class="fld" for="i_${f.k}"><span class="fl-l">${f.l}</span><span class="fl-i"><input type="text" inputmode="decimal" id="i_${f.k}" data-bind="inp.${f.k}" value="${esc(I[f.k] ?? '')}"><em>${f.u}</em></span></label>`).join('');

    const okN = !r.ctx.lim.TN || b.TNeff <= r.ctx.lim.TN + 1e-6, okP = !r.ctx.lim.TP || b.TPeff <= r.ctx.lim.TP + 1e-6;

  <div class="card"><h2>Bölgeler</h2><div class="tw"><table class="rt"><thead><tr><th>Bölge</th><th>Hacim m³</th><th>Pay</th><th>HRT (Q_DW,d) h</th></tr></thead><tbody>

  <p class="hint">Tüm sistemler aynı ünite parametreleriyle hesaplanır. TP, kimyasal P giderimi seçiliyse hedef değere eşitlenir.</p></div>`;
}

function setPath(path, val) {
  const [a, b, c] = path.split('.');
  if (a === 'proj') S.project[b] = val;
  else if (a === 'inp') sc().inp[b] = val;
  else if (a === 'p') { sc().p[b] = sc().p[b] || {}; if (val === '') delete sc().p[b][c]; else sc().p[b][c] = val; }
}
let rT = null;
function refresh() {
  clearTimeout(rT);
  rT = setTimeout(() => {
    const res = compute(S, sc());
    const out = $('#out');
    if (out) {
      if (S.page === 'data') out.innerHTML = dataOut(res);
      else if (S.page === 'sys') out.innerHTML = sysOut(res);
      else if (UNITS[S.page]) {
        out.innerHTML = unitOut(S.page, res);
        const auto = (res.R[S.page] && res.R[S.page].auto) || {};
        document.querySelectorAll('input[data-auto]').forEach(el => { const k = el.dataset.auto; if (k) el.placeholder = 'oto: ' + (auto[k] != null ? fmtN(auto[k], Number.isInteger(auto[k]) ? 0 : 2) : '—'); });
      }
    }

      const k = b.dataset.page; if (!UNITS[k]) return;

    });

}
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.bind) { setPath(t.dataset.bind, t.value); save(); refresh(); }
  else if (t.dataset.scname !== undefined) { S.scen[+t.dataset.scname].name = t.value; save(); $('#scsel').options[+t.dataset.scname].textContent = t.value; }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.unit) { S.units[t.dataset.unit] = t.checked; save(); renderShell(); }
  else if (t.hasAttribute('data-sys')) { S.system = t.value; save(); renderShell(); }
  else if (t.id === 'scsel') { S.act = +t.value; save(); renderShell(); }
  else if (t.id === 'fLoad' && t.files[0]) {
    const rd = new FileReader();
    rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o.scen) throw 0; S = Object.assign(defaultState(), o); S.page = 'home'; save(); renderShell(); toast('Proje yüklendi'); } catch (er) { toast('Dosya okunamadı: geçerli bir proje .json dosyası seçin'); } };
    rd.readAsText(t.files[0]);
  }
  else if (t.tagName === 'SELECT' && t.dataset.bind) { setPath(t.dataset.bind, t.value); save(); refresh(); }
});
document.addEventListener('click', (e) => {
  const t = e.target.closest('button,[data-sysrow]'); if (!t) return;
  if (t.dataset.page) { S.page = t.dataset.page; save(); renderShell(); window.scrollTo(0, 0); return; }
  if (t.dataset.sysrow) { S.system = t.dataset.sysrow; save(); renderShell(); return; }
  if (t.dataset.act !== undefined) { S.act = +t.dataset.act; save(); renderShell(); return; }
  if (t.dataset.dup !== undefined) { const c = JSON.parse(JSON.stringify(S.scen[+t.dataset.dup])); c.name += ' (kopya)'; S.scen.push(c); S.act = S.scen.length - 1; save(); renderShell(); return; }
  if (t.dataset.del !== undefined) { S.scen.splice(+t.dataset.del, 1); S.act = 0; save(); renderShell(); return; }
  if (t.dataset.resetunit) { delete sc().p[t.dataset.resetunit]; save(); renderPage(); return; }
  if (t.hasAttribute('data-word')) { makeWord(t); return; }

  if (t.id === 'bSave') { saveJson(); return; }

// ---------- ArıtmaCAD aktarımı: ünite ebatları → çizim ----------

  return { format: 'AritmaCAD-proses', surum: 2, kaynak: 'ATV-A 131 Proses Hesabı', zaman: new Date().toISOString(), proje: { name: S.project.name, loc: S.project.loc }, kademe: sc().name, sistem: S.system, sistemAd: SYS[S.system].n, debi: { Qd: c.Qd, Qh: c.Qh, Qdw: c.Qdw, Qww: c.Qww, Qmin: c.Qmin, PE: c.PE }, units };
